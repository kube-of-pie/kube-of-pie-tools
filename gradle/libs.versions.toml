[versions]
kotlin = "2.3.21"
ksp = "2.3.7"
micronaut-gradle = "4.5.4"
micronaut-platform = "4.10.13"
jdk = "25"
flyway = "11.10.0"
sqlite-jdbc = "3.50.3.0"
bouncycastle = "1.78.1"

[libraries]
# buildSrc plugin classpath
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
micronaut-gradle-plugin = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle" }

# Micronaut BOM (managed transitively by io.micronaut.application, declared here for reference)
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut-platform" }

# CLI runtime deps (versions resolved by the Micronaut BOM)
micronaut-picocli = { module = "io.micronaut.picocli:micronaut-picocli" }
picocli = { module = "info.picocli:picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen" }

# Storage (versions resolved by the Micronaut BOM where unspecified)
micronaut-data-jdbc = { module = "io.micronaut.data:micronaut-data-jdbc" }
micronaut-data-processor = { module = "io.micronaut.data:micronaut-data-processor" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# Serialization (Micronaut Serde + SnakeYAML for native-image-friendly YAML)
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor" }
snakeyaml = { module = "org.yaml:snakeyaml" }

# Cryptography
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
micronaut-application = { id = "io.micronaut.application", version.ref = "micronaut-gradle" }